# Security headers for every response the PWA's own origin serves.
#
# Included from the server block AND from every location that sets its own add_header: nginx
# drops all inherited add_header directives in a location that declares any of its own, so a
# location with a Cache-Control header would otherwise silently serve with no security headers.
#
# Only the browser delivery is affected. The APK bundles its assets and never loads a page
# from nginx, so nothing here can break the packaged app.
#
# The CSP is what docs/roadmap.md §1 called "the cheapest real control here": connect-src 'self'
# stops an injected script from sending readings anywhere but this origin.
#   - style-src 'unsafe-inline': MUI/emotion inject <style> elements at runtime.
#   - img-src / media-src blob: data:: captured photos, voice notes and clips are played from
#     object URLs (utils/mediaUrls.ts); canvas exports use data:.
#   - worker-src 'self': the Workbox service worker.
# If a future change needs another source, add it here and redeploy — or, to diagnose in the
# field, rename the header to Content-Security-Policy-Report-Only via a mounted copy of this file.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

# HSTS is deliberately absent. With a private CA and IP-based URLs it buys little and can strand a
# site that has to fall back to another address; it needs its own decision (docs/roadmap.md §1).
