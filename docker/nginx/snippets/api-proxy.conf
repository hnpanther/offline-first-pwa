# How a request is handed to Spring Boot — everything except `proxy_pass` itself, which names the
# upstream from an environment variable and therefore lives in the site template.
#
# One file because there is more than one /api location since the login endpoints got their own
# (rate-limited) blocks: a proxy header set in one of them and forgotten in another is exactly
# the kind of drift that shows up as "the audit trail records the wrong address, but only for
# logins".

proxy_http_version 1.1;
proxy_set_header Connection        "";
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# Overwritten, never appended: nginx is the first hop, and the backend records the FIRST
# entry of X-Forwarded-For as the client address (sessions, audit, request logs).
# $proxy_add_x_forwarded_for would keep whatever the client sent in front, letting any
# caller choose the address the audit trail records.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# nginx's own id for this request — the `request_id` field of the access log — as the backend's
# correlation id. The backend's RequestMdcFilter takes X-Correlation-Id when present and puts it on
# every log line of the request, so one id finds the request in both logs. Overwritten, never
# passed through: a value a client sent would otherwise choose what the backend's log says.
proxy_set_header X-Correlation-Id  $request_id;

# A large attachment on plant Wi-Fi must not be cut off mid-request. The client gives
# an upload 120 s (UPLOAD_TIMEOUT_MS); nginx must not give up first.
proxy_read_timeout 300s;
proxy_send_timeout 300s;

# Stream uploads straight through instead of spooling a 25 MB video to the container's
# disk first — the root filesystem is read-only, and buffering adds nothing here.
proxy_request_buffering off;

# Likewise for responses: a downloaded attachment is streamed to the tablet rather than
# written to a temp file first (there is no writable disk for one, by design).
proxy_max_temp_file_size 0;
