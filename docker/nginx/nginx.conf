# Main nginx configuration for the MFDCS PWA container.
#
# Only process-wide settings live here. The site itself — TLS, the static PWA, the /api proxy —
# is rendered at container start from templates/default.conf.template into conf.d/, with the
# PWA_* environment variables substituted. See docker/DEPLOY.md.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Not a secret, but no reason to announce the exact version to every client either.
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

    # Both go to the container's stdout/stderr (the official image links them there), so
    # `docker compose logs` shows them and Docker's log rotation bounds them.
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
