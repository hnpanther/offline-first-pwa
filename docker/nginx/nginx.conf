# Main nginx configuration for the MFDCS PWA container.
#
# Only process-wide settings live here. The site itself — TLS, the static PWA, the /api proxy —
# is rendered at container start from templates/default.conf.template into conf.d/, with the
# PWA_* environment variables substituted. See docker/DEPLOY.md.

# No `user` directive: the whole process tree already runs as uid 101 (USER in the Dockerfile),
# and nginx only honours `user` when the master starts as root — otherwise it warns and ignores it.
worker_processes  auto;

# The process's own messages — start, reload, shutdown, a bad configuration. Fixed here, because this
# file is not a template and is read before the environment is applied. What requests cause is
# logged at PWA_ERROR_LOG_LEVEL, from the `error_log` in templates/default.conf.template.
error_log  /var/log/nginx/error.log notice;
# /tmp, because uid 101 cannot write /run, which is where this build would put it by default.
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Not a secret, but no reason to announce the exact version to every client either.
    server_tokens off;

    # Redirects nginx makes itself — the trailing slash on a directory, for instance — carry a
    # relative Location. An absolute one would name the port nginx LISTENS on, 8443 inside the
    # container, not the 443 the client connected to, and send the browser somewhere that does
    # not answer.
    absolute_redirect off;

    # ---- Access log: two formats, chosen at start by PWA_LOG_FORMAT ---------------------------
    #
    # The `access_log` line that picks one is in templates/default.conf.template, because only the
    # templates are rendered with the environment; the formats themselves are fixed and live here.
    # Both carry the same facts, so switching changes the shape and nothing else.
    #
    #   main   one line of text per request, for a person reading `tail -f`
    #   json   one JSON object per line, for Filebeat → Logstash (no grok pattern to maintain).
    #          `escape=json` makes nginx escape quotes, backslashes and control characters inside
    #          values, so a crafted User-Agent cannot break a line or forge a second one.
    #
    # request_id is nginx's own 32-hex-digit id for the request. It is also sent to the backend as
    # X-Correlation-Id (snippets/api-proxy.conf), which the backend puts on every log line it writes
    # for that request — the one value that joins this log to the backend's.
    #
    # Numbers are written unquoted only where nginx always has one (status, sizes, request_time);
    # everything that can be empty — the upstream fields on a static file, ssl_* on plain HTTP — is
    # a string, so a line is valid JSON in every case.
    #
    # Deliberately NOT logged: request bodies (sign-in passwords) and the Authorization header
    # (bearer tokens). nginx logs neither unless told to; keep it that way. xff_in is what the
    # CLIENT claimed in X-Forwarded-For — never used for anything, kept because a non-empty value
    # from a tablet is worth noticing.
    log_format  main  '$remote_addr - $remote_user [$time_iso8601] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'rid=$request_id host=$host rt=$request_time '
                      'ua=$upstream_addr us=$upstream_status urt=$upstream_response_time '
                      'lim=$limit_req_status tls=$ssl_protocol/$ssl_cipher';

    log_format  json  escape=json '{'
                      '"time":"$time_iso8601",'
                      '"request_id":"$request_id",'
                      '"remote_addr":"$remote_addr",'
                      '"xff_in":"$http_x_forwarded_for",'
                      '"host":"$host",'
                      '"server_port":"$server_port",'
                      '"method":"$request_method",'
                      '"uri":"$request_uri",'
                      '"protocol":"$server_protocol",'
                      '"status":$status,'
                      '"bytes_sent":$bytes_sent,'
                      '"body_bytes_sent":$body_bytes_sent,'
                      '"request_length":$request_length,'
                      '"request_time":$request_time,'
                      '"upstream_addr":"$upstream_addr",'
                      '"upstream_status":"$upstream_status",'
                      '"upstream_response_time":"$upstream_response_time",'
                      '"limit_req_status":"$limit_req_status",'
                      '"ssl_protocol":"$ssl_protocol",'
                      '"ssl_cipher":"$ssl_cipher",'
                      '"http_referer":"$http_referer",'
                      '"http_user_agent":"$http_user_agent"'
                      '}';

    # Where both logs go depends on what is mounted at /var/log/nginx:
    #
    #   nothing mounted   the image's own access.log / error.log are links to /dev/stdout and
    #                     /dev/stderr, so the lines reach `docker logs` (the pre-1.0.3 behaviour)
    #   a host directory  real files there — what docker-compose.yml does, so the logs outlive the
    #                     container and Filebeat can follow them. See the volume's comment there.
    #
    # entrypoint.d/05-pwa-logs.sh checks the choice and the directory before nginx starts.

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
