# MFDCS PWA behind nginx. Run from this directory:
#   cp .env.example .env        # then edit it
#   docker compose up -d --build
# Full procedure, certificates and troubleshooting: DEPLOY.md

name: mfdcs

services:
  pwa:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: ${PWA_IMAGE_TAG:?set PWA_IMAGE_TAG in docker/.env to the release being run, e.g. 1.0.2}
    # Required, with no fallback. It used to default to `latest`, which made "which build is
    # running on this host" a question nobody could answer from the host — and a rollback
    # impossible to express.
    image: mfdcs-pwa:${PWA_IMAGE_TAG:?set PWA_IMAGE_TAG in docker/.env to the release being run, e.g. 1.0.2}
    container_name: mfdcs-pwa
    restart: unless-stopped

    # host:container. Inside, nginx listens on 8080/8443 because it runs as uid 101, which cannot
    # bind below 1024; the host side stays 80/443, so nothing changes for a client.
    ports:
      - "${PWA_HTTP_PORT:-80}:8080"
      - "${PWA_HTTPS_PORT:-443}:8443"

    environment:
      PWA_SERVER_NAME: ${PWA_SERVER_NAME:-_}
      PWA_BACKEND_UPSTREAM: ${PWA_BACKEND_UPSTREAM:-http://host.docker.internal:8081}
      PWA_MAX_BODY_SIZE: ${PWA_MAX_BODY_SIZE:-32m}
      # Sign-in rate limit per client address, and how long browsers remember "HTTPS only".
      # DEPLOY.md §5 says when to change them.
      PWA_LOGIN_RATE: ${PWA_LOGIN_RATE:-60r/m}
      PWA_LOGIN_BURST: ${PWA_LOGIN_BURST:-30}
      PWA_HSTS_MAX_AGE: ${PWA_HSTS_MAX_AGE:-31536000}
      # Access log format: `json` (one JSON object per line, for Filebeat → Logstash) or `main`
      # (one line of text). Anything else stops the container at start with a message.
      PWA_LOG_FORMAT: ${PWA_LOG_FORMAT:-json}
      # The time zone the log timestamps are written in. They carry their offset either way
      # (2026-11-17T10:15:00+03:30), so this only decides what a person reading them sees.
      TZ: ${PWA_TZ:-Asia/Tehran}

    # Lets the container reach a backend running on the Docker host itself (Linux needs this
    # line; Docker Desktop provides the name anyway).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # ---- Files on the host: owner and mode ------------------------------------------------------
    #
    # nginx runs as uid 101 and gid 101 from start to finish, with no capabilities — so not even
    # the container's root could read past a permission. Each path below must be readable (and the
    # logs directory writable) BY THE NUMBER 101; on the host that number may belong to an account
    # with another name, or to none, and that does not matter. Run from this directory (docker/):
    #
    #   path              owner:group   mode   why
    #   ----------------  ------------  -----  ------------------------------------------------------
    #   ssl/              root:root     0755   nginx only needs to enter it
    #   ssl/cert.pem      root:root     0644   public; nginx reads it
    #   ssl/key.pem       101:101       0400   only nginx may read it, and nothing needs to write it
    #   logs/             101:101       0750   nginx creates and appends access.log / error.log;
    #                                          root (Filebeat, logrotate) reads; nobody else
    #   logs/*.log        101:101       0644   created by nginx itself — nothing to do
    #   .env              root:root     0644   read by `docker compose`, not by the container; holds
    #                                          no secret
    #
    #   sudo mkdir -p ssl logs
    #   sudo chown root:root ssl ssl/cert.pem && sudo chmod 0755 ssl && sudo chmod 0644 ssl/cert.pem
    #   sudo chown 101:101 ssl/key.pem && sudo chmod 0400 ssl/key.pem
    #   sudo chown 101:101 logs && sudo chmod 0750 logs
    #
    # Each row was tested with the image's own user (2026-11-17, DEPLOY.md §4), including what
    # happens when it is wrong:
    #   key.pem root:root 0600         nginx stops: [emerg] cannot load certificate key … Permission denied
    #   key.pem root:101 0440          works too (read through the group) — an equally good choice
    #   logs/ root:root 0755           the container stops before nginx: "FATAL: /var/log/nginx is not
    #                                  writable by uid 101. On the host: chown 101:101 …"
    #   logs/ root:101 0770            nginx starts — but logrotate refuses a group-writable directory
    #                                  ("insecure permissions") and the logs then grow without limit
    #   logs/access.log owned by root  the container stops: "FATAL: …/access.log exists and is not
    #                                  writable by uid 101" — what a logrotate `create` with the wrong
    #                                  owner produces
    volumes:
      # cert.pem + key.pem, issued by the plant's CA. Read-only: nginx only reads them. Owner and
      # mode: the table above. docker/DEPLOY.md §4.
      - ./ssl:/etc/nginx/ssl:ro
      # nginx's access and error logs, as files on the host — so they survive the container being
      # recreated (every `docker compose up -d` with a new image does that, and takes Docker's own
      # copy of the container's output with it), and so Filebeat can follow them into Logstash.
      # Rotate them with docker/logrotate/mfdcs-pwa. Owner and mode: the table above.
      #
      # ⚠ A BIND MOUNT (a host path, as here), not a named volume. Docker copies the image's
      # contents into an empty named volume — and in this image /var/log/nginx holds two links,
      # access.log → /dev/stdout and error.log → /dev/stderr. A named volume would therefore keep
      # sending every line to `docker logs` and never write a file. The container says which of
      # the two is happening on its first log line.
      #
      # Remove this line to go back to logs in `docker logs` only.
      - ./logs:/var/log/nginx
      # Optional site override. Uncomment to replace the whole server config with your own copy
      # (start from nginx/templates/default.conf.template):
      # - ./overrides/templates:/etc/nginx/templates:ro
      # Optional header override (e.g. CSP in report-only mode while diagnosing):
      # - ./overrides/snippets:/etc/nginx/snippets:ro

    # Hardening. The whole container runs as uid 101 (USER in the Dockerfile) with no
    # capabilities at all, and nothing in it needs to write except these scratch paths — each
    # mounted owned by 101, since a tmpfs is otherwise root's. /tmp holds the pid file.
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,uid=101,gid=101,mode=0700
      - /etc/nginx/conf.d:size=1m,uid=101,gid=101,mode=0755
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Resources. SIZED FOR a 2 vCPU / 16 GB host that runs nothing but this container.
    #
    # nginx itself needs tens of megabytes: one worker per vCPU (worker_processes auto), and
    # uploads and downloads stream through instead of being held whole (proxy_request_buffering
    # off and proxy_max_temp_file_size 0 in the site template). The tmpfs mounts above add at most
    # 26 MB, and tmpfs counts against this limit. So 1 GB is a ceiling against a leak, not a
    # budget: the rest of the host's RAM is simply not needed.
    deploy:
      resources:
        limits:
          memory: 1g
          # 2 vCPU host: 1.75 leaves a quarter of a core so SSH still gets in while TLS
          # handshakes keep both workers busy. worker_processes stays 2 — nginx counts CPUs, not
          # the quota.
          cpus: "1.75"
        reservations:
          memory: 128m

    # Docker's capture of the container's own output. With ./logs mounted that is only the
    # entrypoint's start-up lines and anything nginx says before it has opened its log files; the
    # access log is NOT here. Capped all the same, so a misconfiguration cannot fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
