# Where Gradle finds the Android SDK. Committed with a working default so a fresh clone builds;
# change it only if your SDK is somewhere else.
#
#   1. FORWARD SLASHES, and escape the drive colon as "\:".
#      This is a Java .properties file, where "\" starts an escape sequence. A plain Windows path
#      (sdk.dir=C:\Android\Sdk) fails with
#
#          The filename, directory name, or volume label syntax is incorrect
#
#      which reads like a PATH or Gradle problem and is neither.
#
#   2. Point it at the directory that CONTAINS platforms/ and build-tools/ — not at cmdline-tools.
#      Installing the SDK is docs/apk.md section 2.1; this project needs platforms;android-36 and
#      build-tools;35.0.0.
#
#   Windows   sdk.dir=C\:/Android/Sdk
#   macOS     sdk.dir=/Users/<you>/Library/Android/sdk
#   Linux     sdk.dir=/home/<you>/Android/Sdk
#
# If you change this line, keep the change out of git — it is this machine's path, not the
# project's:
#
#   git update-index --skip-worktree android/local.properties
#
# (and `--no-skip-worktree` to undo). Committing your own path breaks the build for everyone else,
# and it breaks it at Gradle configuration time with the message above rather than anywhere useful.

sdk.dir=C\:/Android/Sdk
